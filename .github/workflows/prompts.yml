name: Evaluacion Automatizada de Prompts (Lab 09)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  evals-y-pruebas:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install pytest jsonschema

      - name: Ejecutar Evals Tarea A (Criterios de Aceptacion)
        working-directory: prompts/criterios
        run: |
          npx --yes promptfoo@0.118.0 eval --no-cache -o resultados_criterios.json

      - name: Ejecutar Evals Tarea B (Prioridad de Reportes - Caso 8)
        working-directory: prompts/prioridad
        run: |
          npx --yes promptfoo@0.118.0 eval --no-cache -o resultados_prioridad.json

      - name: Ejecutar pruebas de integracion y contratos JSON Schema
        run: |
          PYTHONPATH=. pytest tests/test_prompts_integracion.py -v
