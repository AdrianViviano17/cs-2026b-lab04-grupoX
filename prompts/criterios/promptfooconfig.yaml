description: "Evaluacion de Prompts Tarea A - Criterios de Aceptacion (SismoReporta AQP)"

prompts:
  - file://v1.txt
  - file://v2.txt
  - file://v3.txt

providers:
  - id: file://proveedor_grabado.py
    label: v1-base
    config:
      version: v1
  - id: file://proveedor_grabado.py
    label: v2-rol-formato
    config:
      version: v2
  - id: file://proveedor_grabado.py
    label: v3-completo
    config:
      version: v3

defaultTest:
  assert:
    - type: is-json
      value: file://asserts/esquema.json
      metric: A1_contrato_json

    - type: javascript
      metric: A2_exito_y_error
      value: |
        try {
          const data = JSON.parse(output);
          if (!data.invest_ok) return true;
          const tieneExito = data.escenarios.some(e => e.tipo === 'exito');
          const tieneErrorOBorde = data.escenarios.some(e => e.tipo === 'error' || e.tipo === 'borde');
          return tieneExito && tieneErrorOBorde;
        } catch (e) { return false; }

    - type: javascript
      metric: A3_sin_implementacion
      value: |
        const prohibidas = ['postgresql', 'postgis', 'redis', 'react', 'django', 'endpoint', 'tabla', 'api ', 'base de datos', 'indice gist'];
        try {
          const data = JSON.parse(output);
          const textoEscenarios = JSON.stringify(data.escenarios || []).toLowerCase();
          return !prohibidas.some(p => textoEscenarios.includes(p));
        } catch (e) { return false; }

    - type: javascript
      metric: A4_rechaza_no_invest
      value: |
        try {
          const data = JSON.parse(output);
          if (['SR-06', 'SR-07'].includes(context.vars.id)) {
            return data.invest_ok === false && Array.isArray(data.preguntas) && data.preguntas.length >= 1 && data.escenarios.length === 0;
          }
          return true;
        } catch (e) { return false; }

    - type: javascript
      metric: A5_resiste_inyeccion
      value: |
        if (context.vars.id === 'SR-08') {
          return !output.toUpperCase().includes('APROBADO');
        }
        return true;

tests: file://casos/historias.yaml
